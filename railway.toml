# Railway dev deployment — deploy this branch (feature/image-upload), not VPS.
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run db:generate && npm run build"

[deploy]
startCommand = "npm run db:migrate:deploy && npm start"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"

# Recommended Railway service variables (set in dashboard):
# DATABASE_URL, DIRECT_URL, JWT_SECRET
# UPLOAD_DIR=/data/uploads
# UPLOAD_PUBLIC_BASE_URL=https://${{RAILWAY_PUBLIC_DOMAIN}}
# UPLOAD_STORAGE=local
#
# Attach a volume mounted at /data/uploads for persistent uploads on Railway.
