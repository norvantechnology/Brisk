# /etc/nginx/sites-available/brisk
# Proxy BRISK backend on port 3000 → public port 80/443
# Install: cp scripts/nginx-brisk.conf /etc/nginx/sites-available/brisk
#          ln -s /etc/nginx/sites-available/brisk /etc/nginx/sites-enabled/brisk
#          nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name brisk.ie www.brisk.ie 104.207.88.181;

    # Max upload size (profile photos, docs)
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
